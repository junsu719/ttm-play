    <main id="game" aria-label="山道騎乘">
      <canvas id="renderCanvas" aria-label="速克達與台灣山道"></canvas>
      <header class="hud">
        <div class="project"><span class="eyebrow">TAIWAN TOUGE MONKEY</span><h1>山道夜行 <span>01</span></h1></div>

      </div>

          <button type="button" data-action="left" aria-label="LEFT 向左" aria-pressed="false"><span class="symbol">◀</span><span>LEFT</span></button>
          <button type="button" data-action="right" aria-label="RIGHT 向右" aria-pressed="false"><span class="symbol">▶</span><span>RIGHT</span></button>
        </div>
        <div class="control-group">
          <button type="button" data-action="brake" class="brake" aria-label="BRAKE 煞車" aria-pressed="false"><span class="symbol">▰</span><span>BRAKE</span></button>
          <button type="button" data-action="throttle" class="gas" aria-label="GAS 油門" aria-pressed="false"><span class="symbol">↑</span><span>GAS</span></button>
        </div>
      </div>
      <div id="rotate" class="overlay rotate" role="status"><span class="rotate-icon" aria-hidden="true">↻</span><h2>請將手機橫向</h2><p>左手控制方向，右手油門與煞車。</p></div>
